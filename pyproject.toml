[project]
name = "ndis-case-note-assistant"
version = "0.1.0"
description = "Fine-tuned small model for structured NDIS case note generation"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "bitsandbytes>=0.49.2",
    "click>=8.4.1",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mypy>=2.1.0",
    "numpy>=2.4.6",
    "openai>=2.40.0",
    "pandas>=3.0.3",
    "peft>=0.19.1",
    "pydantic>=2.13.4",
    "pydantic-evals>=1.105.0",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.12.0",
    "ruff>=0.15.15",
    "scikit-learn>=1.9.0",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "transformers>=5.9.0",
    "trl>=1.5.1",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
dev = []

[tool.ruff]
target-version = "py314"
line-length = 99


[tool.pyright]
pythonVersion = "3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndis", "src"]

[project.scripts]
ndis = "cli:main"
